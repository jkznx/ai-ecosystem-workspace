[project]
name = "ai-ecosystem-workspace"
version = "0.1.0"
description = "AI ecosystem workspace with scheduled GPU training"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "arq>=0.28.0",
    "bcrypt>=4.1.2,<5.0.0",
    "click>=8,<8.3",
    "email-validator>=2.0.0",
    "fastapi>=0.110.0",
    "label-studio-sdk>=2.1.0",
    "minio>=7.2.20",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
    "opentelemetry-instrumentation-redis>=0.49b0,<1",
    "opentelemetry-instrumentation-requests>=0.49b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1",
    "opentelemetry-instrumentation-urllib3>=0.49b0,<1",
    "opentelemetry-sdk>=1.28,<2",
    "openpyxl>=3.1.5",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "prometheus-client>=0.21,<1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
training = [
    "accelerate",
    "datasets",
    "evaluate",
    "mlflow==3.15.0",
    "numpy",
    "seqeval",
    "transformers>=4.45,<5.15",
]
inference = [
    "mlflow==3.15.0",
    "transformers>=4.45,<5.15",
]
