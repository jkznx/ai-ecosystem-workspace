[project]
name = "ai-ecosystem-workspace"
version = "0.1.0"
description = "AI ecosystem workspace with scheduled GPU training"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "arq>=0.28.0",
    "bcrypt>=4.1.2,<5.0.0",
    "email-validator>=2.0.0",
    "fastapi>=0.110.0",
    "label-studio-sdk>=2.1.0",
    "minio>=7.2.20",
    "openpyxl>=3.1.5",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
training = [
    "accelerate",
    "datasets",
    "evaluate",
    "numpy",
    "seqeval",
    "transformers",
]
