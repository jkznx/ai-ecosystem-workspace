global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: trainer-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: trainer-worker
    static_configs:
      - targets:
          - trainer-worker:9101

  - job_name: inference-worker
    static_configs:
      - targets:
          - inference-worker:9102

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345
